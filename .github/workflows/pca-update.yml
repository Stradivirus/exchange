# .github/workflows/pca-update.yml
name: PCA Data Update

on:
  # 하루 2번 실행: UTC 00:10, 12:10 (한국시간 09:10, 21:10)
  # 데이터 수집 후 10분 뒤 실행
  schedule:
    - cron: '10 0,12 * * *'
  
  # 수동 실행 가능
  workflow_dispatch:

jobs:
  update-pca:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas sqlalchemy psycopg2-binary scikit-learn
      
      - name: Run PCA calculation
        env:
          # PostgreSQL 접속 정보
          PG_HOST: ${{ secrets.PG_HOST }}
          PG_DB: ${{ secrets.PG_DB }}
          PG_USER: ${{ secrets.PG_USER }}
          PG_PASSWORD: ${{ secrets.PG_PASSWORD }}
        run: |
          cd Data/PreProcessing
          python all_pca_cron.py
      
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pca-error-logs
          path: Data/PreProcessing/*.log
          retention-days: 7
      
      - name: Notify on success
        if: success()
        run: |
          echo "✅ PCA 계산 성공!"
          echo "완료 시간: $(date)"
      
      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ PCA 계산 실패!"
          echo "실패 시간: $(date)"