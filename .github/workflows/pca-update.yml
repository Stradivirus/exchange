# .github/workflows/pca-update.yml
name: PCA Data Update

on:
  schedule:
    # 하루 2번 실행: UTC 00:10, 12:10 (한국시간 09:10, 21:10)
    - cron: '10 0,12 * * *'
  workflow_dispatch:

jobs:
  update-pca:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas sqlalchemy psycopg2-binary scikit-learn
      
      # [수정됨] SSH 터널링: PG_HOST(록키 서버)로 접속
      - name: Setup SSH Tunnel to PostgreSQL
        env:
          SSH_KEY: ${{ secrets.OCI_SSH }}       # 등록하신 키 (OCI_SSH)
          SSH_HOST: ${{ secrets.PG_HOST }}      # [중요] 호스트를 PG_HOST로 설정
          SSH_USER: rocky                       # [중요] 사용자를 rocky로 설정
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
          # 1. SSH_HOST(DB서버)에 rocky 계정으로 접속
          # 2. 로컬 5432 포트를 -> 원격지(DB서버)의 127.0.0.1:5432로 연결
          ssh -o StrictHostKeyChecking=no -f -N -i ~/.ssh/id_rsa -L 5432:127.0.0.1:5432 $SSH_USER@$SSH_HOST
          
          echo "✅ SSH Tunneling Established to $SSH_HOST as $SSH_USER"

      - name: Run PCA calculation
        env:
          # 파이썬은 로컬 터널(127.0.0.1)을 통해 DB에 접속
          PG_HOST: "127.0.0.1"
          PG_DB: ${{ secrets.PG_DB }}
          PG_USER: ${{ secrets.PG_USER }}
          PG_PASSWORD: ${{ secrets.PG_PASSWORD }}
        run: |
          cd Data/PreProcessing
          python all_pca_cron.py
      
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pca-error-logs
          path: Data/PreProcessing/*.log
          retention-days: 7
      
      - name: Notify on success
        if: success()
        run: |
          echo "✅ PCA 계산 성공!"
          echo "완료 시간: $(date)"
      
      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ PCA 계산 실패!"
          echo "실패 시간: $(date)"