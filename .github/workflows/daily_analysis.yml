name: Daily Financial Analysis & Upload to Oracle

on:
  schedule:
    # UTC 21:00 = 한국 시간(KST) 아침 06:00
    - cron: '0 21 * * *'
  workflow_dispatch: # 수동 실행 버튼

jobs:
  analyze-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    # 1. 코드 가져오기
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 2. 파이썬 설정
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    # 3. 라이브러리 설치
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r Graph/requirements.txt

    # 4. 분석 실행
    - name: Run Analysis
      env:
        MONGO_URI: ${{ secrets.MONGO_URI }}
        # 리소스 제한 (무료 티어 서버 안정성 확보)
        OMP_NUM_THREADS: "1"
        N_JOBS_LIMIT: "1"
      run: |
        cd Graph
        python main.py

    # 5. 오라클 CLI 설치
    - name: Install OCI CLI
      run: |
        mkdir -p ~/.oci
        bash -c "$(curl -L https://raw.githubusercontent.com/oracle/oci-cli/master/scripts/install/install.sh)" -- --accept-all-defaults
        echo "/home/runner/bin" >> $GITHUB_PATH
        exec -l $SHELL

    # 6. 오라클 인증 설정
    - name: Configure OCI CLI
      env:
        OCI_USER: ${{ secrets.OCI_USER }}
        OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
        OCI_TENANCY: ${{ secrets.OCI_TENANCY }}
        OCI_REGION: ${{ secrets.OCI_REGION }}
        OCI_KEY_CONTENT: ${{ secrets.OCI_KEY_CONTENT }}
      run: |
        # Config 파일 생성
        echo "[DEFAULT]" > ~/.oci/config
        echo "user=${OCI_USER}" >> ~/.oci/config
        echo "fingerprint=${OCI_FINGERPRINT}" >> ~/.oci/config
        echo "tenancy=${OCI_TENANCY}" >> ~/.oci/config
        echo "region=${OCI_REGION}" >> ~/.oci/config
        echo "key_file=~/.oci/oci_api_key.pem" >> ~/.oci/config
        
        # Private Key 파일 생성 (moon.key 내용이 여기에 들어감)
        echo "${OCI_KEY_CONTENT}" > ~/.oci/oci_api_key.pem
        chmod 600 ~/.oci/oci_api_key.pem

    # 7. 결과물 업로드
    - name: Upload to Oracle Object Storage
      run: |
        # 네임스페이스: axt322c13ce3, 버킷: Exchange
        # --overwrite: 덮어쓰기, --force: 강제 진행
        /home/runner/bin/oci os object bulk-upload \
          --namespace-name axt322c13ce3 \
          --bucket-name Exchange \
          --src-dir Graph/outputs \
          --overwrite \
          --force