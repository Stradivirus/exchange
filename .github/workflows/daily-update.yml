# .github/workflows/daily-update.yml
name: Daily Data Update

on:
  # 매일 UTC 00:00 (한국시간 오전 9시)
  schedule:
    - cron: '0 */6 * * *'
  
  # 수동 실행 가능
  workflow_dispatch:
    inputs:
      categories:
        description: '실행할 카테고리 (쉼표 구분, 비워두면 전체)'
        required: false
        default: ''

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Data/Data_collection/requirements.txt
      
      - name: Run daily update
        env:
          # GitHub Secrets에서 환경변수 주입
          MONGO_URI: ${{ secrets.MONGO_URI }}
          MONGO_DB: ${{ secrets.MONGO_DB }}
          BOK_API_KEY: ${{ secrets.BOK_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          cd Data/Data_collection/daily_update
          if [ -n "${{ github.event.inputs.categories }}" ]; then
            python main.py --categories "${{ github.event.inputs.categories }}"
          else
            python main.py
          fi
      
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-logs
          path: daily_update/*.log
          retention-days: 7
      
      - name: Notify on success
        if: success()
        run: |
          echo "✅ 데이터 업데이트 성공!"
          echo "완료 시간: $(date)"
      
      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ 데이터 업데이트 실패!"
          echo "실패 시간: $(date)"